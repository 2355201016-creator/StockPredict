<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Stock Predict</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>

        *{
            font-family: 'Poppins', sans-serif;
        }

        body{
            background:
            linear-gradient(
                135deg,
                #020617,
                #0f172a,
                #111827
            );

            min-height: 100vh;

            color: white;
        }

        .theme-toggle{

            position: fixed;

            top: 20px;

            right: 20px;

            z-index: 999;

            border: none;

            padding: 14px 24px;

            border-radius: 16px;

            background:
            linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            color: white;

            font-weight: 700;
        }

        .main-card,
        .chart-card,
        .info-card,
        .prediction-card{

            background:
            rgba(15,23,42,0.7);

            backdrop-filter: blur(10px);

            border-radius: 24px;

            border:
            1px solid rgba(255,255,255,0.06);

            box-shadow:
            0 15px 35px rgba(0,0,0,0.25);
        }

        .navbar-custom{

            padding: 20px;
        }

        .logo{

            font-size: 28px;

            font-weight: 800;

            letter-spacing: 2px;
        }

        .dashboard-title{

            font-size: 44px;

            font-weight: 800;
        }

        .dashboard-subtitle{

            color: #94a3b8;
        }

        .main-card{

            padding: 40px;
        }

        .info-card{

            padding: 30px;

            height: 100%;
        }

        .info-title{

            color: #94a3b8;

            font-size: 14px;

            letter-spacing: 1px;
        }

        .info-value{

            font-size: 40px;

            font-weight: 700;

            margin-top: 15px;
        }

        .chart-card,
        .prediction-card{

            padding: 35px;
        }

        .chart-title{

            font-size: 24px;

            font-weight: 700;

            margin-bottom: 25px;
        }

        .form-control,
        .form-select{

            height: 60px;

            border-radius: 16px;

            background: #1e293b;

            border:
            1px solid rgba(255,255,255,0.08);

            color: white;
        }

        .form-select option{

            background: #1e293b;
        }

        .btn-predict{

            background:
            linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            border: none;

            padding: 18px;

            font-size: 18px;

            font-weight: 700;

            border-radius: 18px;
        }

        canvas{

            height: 500px !important;
        }

        /* TABLE */

        .prediction-header{

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

            flex-wrap: wrap;
        }

        .accuracy-badge{

            background:
            rgba(16,185,129,0.12);

            color: #10b981;

            padding: 12px 22px;

            border-radius: 999px;

            font-weight: 700;
        }

        .custom-table-wrapper{

            max-height: 500px;

            overflow-y: auto;

            border-radius: 18px;
        }

        .prediction-table{

            width: 100%;

            border-collapse: collapse;

            color: white;
        }

        .prediction-table thead th{

            position: sticky;

            top: 0;

            background: #1e293b;

            color: #94a3b8;

            padding: 18px;

            font-size: 13px;

            letter-spacing: 1px;

            text-transform: uppercase;
        }

        .prediction-table tbody td{

            padding: 20px;

            border-top:
            1px solid rgba(255,255,255,0.06);
        }

        .prediction-table tbody tr:hover{

            background:
            rgba(255,255,255,0.03);
        }

        .actual-price{

            color: #60a5fa;

            font-weight: 600;
        }

        .predicted-price{

            color: #c084fc;

            font-weight: 600;
        }

        @media (max-width: 768px){

            .dashboard-title{

                font-size: 28px;
            }

            .main-card,
            .chart-card,
            .prediction-card{

                padding: 22px;
            }

            .info-value{

                font-size: 26px;
            }

            canvas{

                height: 280px !important;
            }

        }

    </style>

</head>

<body>

<nav class="navbar navbar-custom">

    <div class="container">

        <div class="logo">
            STOCK PREDICT
        </div>

    </div>

</nav>

<div class="container mt-5">

    <!-- HEADER -->

    <div class="text-center mb-5">

        <h1 class="dashboard-title">
            AI Stock Prediction Dashboard
        </h1>

        <p class="dashboard-subtitle">
            Machine Learning Based Stock Forecasting
        </p>

    </div>

    <!-- FORM -->

    <div class="main-card">

        <div class="row g-4">

            <div class="col-md-4">

                <label class="mb-2">
                    Pilih Saham
                </label>

                <select id="symbol"
                        class="form-select">

                    <option value="BBCA.JK">
                        BBCA - Bank Central Asia
                    </option>

                    <option value="BBRI.JK">
                        BBRI - Bank Rakyat Indonesia
                    </option>

                    <option value="BMRI.JK">
                        BMRI - Bank Mandiri
                    </option>

                    <option value="TLKM.JK">
                        TLKM - Telkom Indonesia
                    </option>

                </select>

            </div>

            <div class="col-md-4">

                <label class="mb-2">
                    Tanggal Mulai
                </label>

                <input type="date"
                       id="start"
                       class="form-control">

            </div>

            <div class="col-md-4">

                <label class="mb-2">
                    Tanggal Akhir
                </label>

                <input type="date"
                       id="end"
                       class="form-control">

            </div>

        </div>

        <button onclick="predict()"
                class="btn btn-primary btn-predict w-100 mt-4">

            Analisis & Prediksi Saham

        </button>

    </div>

    <!-- INFO -->

    <div class="row mt-5 g-4">

        <div class="col-md-3">

            <div class="info-card">

                <div class="info-title">
                    HARGA TERAKHIR
                </div>

                <div class="info-value"
                     id="lastPrice">

                    -

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="info-card">

                <div class="info-title">
                    TREND
                </div>

                <div class="info-value"
                     id="trend">

                    -

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="info-card">

                <div class="info-title">
                    RECOMMENDATION
                </div>

                <div class="info-value"
                     id="recommendation">

                    -

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="info-card">

                <div class="info-title">
                    AI CONFIDENCE
                </div>

                <div class="info-value"
                     id="confidence">

                    -

                </div>

            </div>

        </div>

    </div>

    <!-- CHART -->

    <div class="chart-card mt-5">

        <h3 class="chart-title">
            Grafik Prediksi Saham
        </h3>

        <canvas id="chart"></canvas>

    </div>

    <!-- TABLE -->

    <div class="prediction-card mt-5">

        <div class="prediction-header">

            <h4>
                Prediction Data Details
            </h4>

            <div class="accuracy-badge">

                Accuracy Rate: 99.49%

            </div>

        </div>

        <div class="table-responsive custom-table-wrapper">

            <table class="prediction-table">

                <thead>

                    <tr>

                        <th>
                            DATE
                        </th>

                        <th>
                            ORIGINAL PRICE
                        </th>

                        <th>
                            PRICE PREDICTION
                        </th>

                    </tr>

                </thead>

                <tbody id="predictionTableBody">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
